name: file-viewer-dev

services:
  backend:
    build:
      context: .
      target: development
    environment:
      ENVIRONMENT: development
      SOURCE_ALLOWED_HOSTS: source.localhost
      SOURCE_ALLOWED_PORTS: 8081
      SOURCE_ALLOWED_SCHEMES: http
      CACHE_DIR: /var/cache/file-viewer
    extra_hosts:
      - "source.localhost:host-gateway"
    ports:
      - "8080:8080"
    volumes:
      - ./backend/app:/app/app
      - backend-cache:/var/cache/file-viewer
    depends_on:
      source:
        condition: service_started

  frontend:
    image: node:22-alpine
    working_dir: /web
    command: ["sh", "-c", "corepack enable && pnpm install --frozen-lockfile && pnpm run dev"]
    environment:
      VITE_API_PROXY: http://backend:8080
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/web
      - frontend-modules:/web/node_modules
    depends_on:
      - backend

  fixture-init:
    build:
      context: .
      target: development
    command: ["python", "/app/scripts/generate_fixtures.py", "/fixtures"]
    volumes:
      - fixture-data:/fixtures

  source:
    image: nginx:1.27-alpine
    ports:
      - "8081:80"
    volumes:
      - fixture-data:/usr/share/nginx/html/files:ro
      - ./deploy/source-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      fixture-init:
        condition: service_completed_successfully

  demo:
    image: nginx:1.27-alpine
    ports:
      - "8082:80"
    volumes:
      - ./demo:/usr/share/nginx/html:ro

volumes:
  backend-cache:
  frontend-modules:
  fixture-data:
