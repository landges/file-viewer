name: file-viewer

services:
  traefik:
    image: traefik:v3.3
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "8080:80"
      - "8088:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  viewer:
    build:
      context: .
      target: runtime
    environment:
      ENVIRONMENT: development
      SOURCE_ALLOWED_HOSTS: source.localhost,source
      SOURCE_ALLOWED_PORTS: 80,8081
      SOURCE_ALLOWED_SCHEMES: http
      CACHE_TTL_SECONDS: 86400
      MAX_CONCURRENT_CONVERSIONS: 2
    extra_hosts:
      - "source.localhost:host-gateway"
    volumes:
      - viewer-cache:/var/cache/file-viewer
    labels:
      - traefik.enable=true
      - traefik.http.routers.viewer.rule=Host(`viewer.localhost`) || Host(`localhost`) || Host(`127.0.0.1`)
      - traefik.http.routers.viewer.entrypoints=web
      - traefik.http.services.viewer.loadbalancer.server.port=8080
      - traefik.http.services.viewer.loadbalancer.sticky.cookie=true
      - traefik.http.services.viewer.loadbalancer.sticky.cookie.name=fv_affinity
      - traefik.http.services.viewer.loadbalancer.sticky.cookie.httponly=true
      - traefik.http.services.viewer.loadbalancer.sticky.cookie.secure=false
    depends_on:
      source:
        condition: service_started
    restart: unless-stopped

  fixture-init:
    build:
      context: .
      target: development
    command: ["python", "/app/scripts/generate_fixtures.py", "/fixtures"]
    volumes:
      - fixture-data:/fixtures
    restart: "no"

  source:
    image: nginx:1.27-alpine
    ports:
      - "8081:80"
    volumes:
      - fixture-data:/usr/share/nginx/html/files:ro
      - ./deploy/source-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      fixture-init:
        condition: service_completed_successfully
    restart: unless-stopped

  demo:
    image: nginx:1.27-alpine
    ports:
      - "8082:80"
    volumes:
      - ./demo:/usr/share/nginx/html:ro
    restart: unless-stopped

  smoke:
    profiles: ["test"]
    build:
      context: .
      target: development
    command:
      - python
      - /app/scripts/smoke_test.py
      - --viewer
      - http://viewer:8080
      - --source
      - http://source/files
    depends_on:
      viewer:
        condition: service_healthy
      source:
        condition: service_started
    restart: "no"

volumes:
  viewer-cache:
  fixture-data:
