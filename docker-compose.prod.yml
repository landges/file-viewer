name: file-viewer-prod

services:
  viewer:
    image: ${FILE_VIEWER_IMAGE:-file-viewer:latest}
    build:
      context: .
      target: runtime
    environment:
      ENVIRONMENT: production
      SOURCE_ALLOWED_HOSTS: ${SOURCE_ALLOWED_HOSTS:?Set SOURCE_ALLOWED_HOSTS in .env}
      SOURCE_ALLOWED_PORTS: ${SOURCE_ALLOWED_PORTS:-80,443}
      SOURCE_ALLOWED_SCHEMES: ${SOURCE_ALLOWED_SCHEMES:-http,https}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-86400}
      FAILED_TTL_SECONDS: ${FAILED_TTL_SECONDS:-3600}
      MAX_SOURCE_BYTES: ${MAX_SOURCE_BYTES:-536870912}
      MAX_OFFICE_BYTES: ${MAX_OFFICE_BYTES:-209715200}
      MAX_ARCHIVE_BYTES: ${MAX_ARCHIVE_BYTES:-536870912}
      MAX_EXTRACTED_BYTES: ${MAX_EXTRACTED_BYTES:-2147483648}
      MAX_ARCHIVE_ENTRIES: ${MAX_ARCHIVE_ENTRIES:-10000}
      MAX_NESTING_DEPTH: ${MAX_NESTING_DEPTH:-3}
      MAX_CONCURRENT_CONVERSIONS: ${MAX_CONCURRENT_CONVERSIONS:-2}
    ports:
      - "${VIEWER_BIND_ADDRESS:-0.0.0.0}:${VIEWER_PORT:-8080}:8080"
    volumes:
      - viewer-cache:/var/cache/file-viewer
    restart: unless-stopped

volumes:
  viewer-cache:
